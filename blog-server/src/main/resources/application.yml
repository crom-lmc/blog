server:
  # 独立部署端口；前面挂自己的 nginx 时只反向代理到本机即可
  port: ${BLOG_SERVER_PORT:9003}

spring:
  application:
    name: blog-server
  # 配置中心：namespace 区分 local/prod；敏感值只存 Nacos，仓库与镜像内均无明文。
  # optional 保证本地无 Nacos 时仍可用环境变量启动（见 nacos/README.md）。
  config:
    import:
      - "optional:nacos:blog-server.yaml?group=${BLOG_NACOS_GROUP:BLOG}&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${BLOG_NACOS_ADDR:${SSO_NACOS_ADDR:127.0.0.1:8848}}
      username: ${BLOG_NACOS_USER:${SSO_NACOS_USER:nacos}}
      password: ${BLOG_NACOS_PASSWORD:${SSO_NACOS_PASSWORD:}}
      config:
        enabled: ${BLOG_NACOS_ENABLED:false}
        namespace: ${BLOG_NACOS_NAMESPACE:blog-local}
        group: ${BLOG_NACOS_GROUP:BLOG}
        file-extension: yaml
        refresh-enabled: true
  datasource:
    url: ${BLOG_DB_URL:}
    username: ${BLOG_DB_USER:}
    password: ${BLOG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  sql:
    init:
      # 默认不自动初始化；全新库先手工执行 resources/schema.sql 和 data.sql
      mode: ${BLOG_SQL_INIT_MODE:never}
  data:
    redis:
      host: ${BLOG_REDIS_HOST:127.0.0.1}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: ${BLOG_REDIS_DB:0}
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laimengchao.blog.**.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # t_article/t_category 等仍是自增主键；博客侧不用雪花
      id-type: auto

springdoc:
  api-docs:
    # 生产默认关闭接口文档，避免暴露接口清单与内部模型；排障时可临时置 true
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# 业务配置
blog:
  # 自有 JWT：HS256，密钥至少 32 字节。无默认值——必须由 Nacos 或环境变量下发，
  # 缺失时 JwtService 启动即失败，杜绝用弱密钥静默启动。
  jwt:
    secret: ${BLOG_JWT_SECRET:}
    expire-seconds: ${BLOG_JWT_EXPIRE_SECONDS:86400}
  # 首次启动播种的 admin 初始密码；已存在的 admin 不会被覆盖。无默认值，同密钥策略。
  admin:
    default-password: ${BLOG_ADMIN_DEFAULT_PASSWORD:}
  upload:
    root: ${BLOG_UPLOAD_ROOT:./uploads}
    url-prefix: /uploads
    max-size-mb: 5
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp,ico,pdf,mp4
  rate-limit:
    enabled: true
    public-qpm: 300
    comment-qpm: 3
    login-qpm: 10
  comment:
    review-on: true
    sensitive-words: 傻逼,垃圾,广告,代刷,赌博
  search:
    mode: fulltext
  site:
    base-url: ${BLOG_SITE_BASE_URL:http://localhost:9003}

logging:
  level:
    root: info
    com.laimengchao.blog: debug
    org.springframework.security: warn
